name: Build Android & iOS Mobile Apps

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Build Android App (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Android Web Bundle
        run: |
          cd "Minecarft Server android App"
          npm ci || npm install
          npm run build
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android Debug APK
        run: |
          cd "Minecarft Server android App/android"
          gradle assembleDebug --no-daemon


      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMP-Minecraft-Server-Android-APK
          path: Minecarft Server android App/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  build-ios:
    name: 🍎 Build iOS App Bundle
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build iOS Web Bundle
        run: |
          cd "Minecraft Server ios App"
          npm ci || npm install
          npm run build
          mkdir -p ios/App/App/public
          cp -r dist/* ios/App/App/public/

      - name: Upload iOS Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMP-Minecraft-Server-iOS-Project
          path: |
            Minecraft Server ios App/dist/
            Minecraft Server ios App/ios/
          retention-days: 30
